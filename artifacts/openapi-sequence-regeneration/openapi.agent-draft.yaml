openapi: 3.0.3
info:
  title: ВыплатыПро — реестр выплат (перегенерация по навыку)
  version: 2.0.0
  description: |
    Загрузка и проверка реестра самозанятых. Правило навыка E-09: у каждой проверки указан
    источник данных и владелец. Проверки CHK-01…CHK-06 выполняются по файлу и справочнику,
    CHK-07 требует данных о выплатах — для этого описана внутренняя операция сервиса выплат.
servers:
  - url: https://api.vyplatypro.example/v1
tags:
  - name: registries
    description: Реестры выплат
  - name: payouts
    description: Внутренние операции сервиса выплат
security:
  - bearerAuth: []
paths:
  /registries:
    post:
      tags: [registries]
      operationId: uploadRegistry
      summary: Загрузить реестр выплат
      description: |
        Принимает CSV (UTF-8, «;») или XLSX с колонками ФИО, ИНН, Телефон, Сумма, Назначение.
        Лимиты (AS-02): 5000 строк, 10 000 000 ₽ на реестр, 1 000 000 ₽ на строку.
        Источники проверок: файл (CHK-01…CHK-06), сервис выплат (CHK-07).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV или XLSX, не более 5000 строк
      responses:
        '202':
          description: Файл принят, проверка выполняется
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Файл больше допустимого размера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [registries]
      operationId: listRegistries
      summary: Список реестров компании
      description: Постраничный список с фильтром по статусу.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RegistryStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница реестров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /registries/{registryId}:
    get:
      tags: [registries]
      operationId: getRegistry
      summary: Статус реестра
      description: Возвращает статус и счётчики; поддерживает ETag.
      parameters:
        - $ref: '#/components/parameters/RegistryId'
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Реестр
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registry'
        '304':
          description: Данные не изменились
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /registries/{registryId}/rows:
    get:
      tags: [registries]
      operationId: listRegistryRows
      summary: Строки реестра с результатом проверки
      description: |
        Постранично. Для отклонённых строк — код и понятное описание причины.
        Источник причин: проверки CHK-03…CHK-07 по данным файла и сервиса выплат.
      parameters:
        - $ref: '#/components/parameters/RegistryId'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RowStatus'
        - name: reason
          in: query
          schema:
            $ref: '#/components/schemas/RejectReason'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница строк
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RowPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /registries/{registryId}/report:
    get:
      tags: [registries]
      operationId: getRegistryReport
      summary: Отчёт по проверке реестра
      description: 'Сводка: принято, отклонено, доля ошибок, разбивка по причинам. Сохраняется с реестром.'
      parameters:
        - $ref: '#/components/parameters/RegistryId'
      responses:
        '200':
          description: Отчёт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /registries/{registryId}/revalidation:
    post:
      tags: [registries]
      operationId: requestRegistryRevalidation
      summary: Отправить реестр на повторную проверку
      description: Доступно только для статуса VALIDATION_FAILED; из BLOCKED нужна новая загрузка.
      parameters:
        - $ref: '#/components/parameters/RegistryId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Реестр отправлен на повторную проверку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /payouts/exists:batch:
    post:
      tags: [payouts]
      operationId: checkPayoutsExistBatch
      summary: Пакетная проверка, созданы ли выплаты по строкам реестра
      description: |
        Внутренняя операция сервиса выплат — источник данных для CHK-07. Сервис реестров
        передаёт пачку до 500 строк. Доступ только по сервисному токену.
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [registryId, rowId]
                    properties:
                      registryId:
                        type: string
                        format: uuid
                      rowId:
                        type: string
                        format: uuid
      responses:
        '200':
          description: Результат по каждой строке
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [rowId, paid]
                      properties:
                        rowId:
                          type: string
                          format: uuid
                        paid:
                          type: boolean
                        paidAt:
                          type: string
                          format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
  parameters:
    RegistryId:
      name: registryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    BadRequest:
      description: Некорректный запрос или файл
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Требуется аутентификация
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Нет прав на операцию
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Объект не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Конфликт состояния или ключа идемпотентности
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Внутренняя ошибка
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Сервис временно недоступен
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    RegistryStatus:
      type: string
      enum:
        - UPLOADED
        - VALIDATING
        - CHECKED
        - BLOCKED
        - VALIDATION_FAILED
        - REJECTED
        - CANCELLED
        - PAYING
        - DONE
        - DONE_WITH_ERRORS
    RowStatus:
      type: string
      enum: [NEW, VALIDATED, REJECTED, PAYING, PAID, FAILED]
    RejectReason:
      type: string
      enum:
        - INVALID_INN
        - DUPLICATE_INN
        - AMOUNT_OUT_OF_RANGE
        - INVALID_PHONE
        - ALREADY_PAID
        - MISSING_REQUIRED_FIELD
    RegistryAccepted:
      type: object
      required: [registryId, status, acceptedAt]
      properties:
        registryId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RegistryStatus'
        acceptedAt:
          type: string
          format: date-time
    Registry:
      type: object
      required: [registryId, status, rowCount, totalAmount, acceptedCount, rejectedCount, updatedAt]
      properties:
        registryId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RegistryStatus'
        rowCount:
          type: integer
          minimum: 0
          maximum: 5000
        totalAmount:
          type: string
          pattern: '^\d+\.\d{2}$'
        acceptedCount:
          type: integer
          minimum: 0
        rejectedCount:
          type: integer
          minimum: 0
        errorShare:
          type: number
          minimum: 0
          maximum: 1
        updatedAt:
          type: string
          format: date-time
    RegistryPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Registry'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    RegistryRow:
      type: object
      required: [rowId, status, amount, innMasked]
      properties:
        rowId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RowStatus'
        innMasked:
          type: string
        fullNameMasked:
          type: string
        amount:
          type: string
          pattern: '^\d+\.\d{2}$'
        purpose:
          type: string
        rejectReason:
          $ref: '#/components/schemas/RejectReason'
        rejectMessage:
          type: string
    RowPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RegistryRow'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    ValidationReport:
      type: object
      required: [registryId, status, rowCount, acceptedCount, rejectedCount, errorShare, reasons, generatedAt]
      properties:
        registryId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RegistryStatus'
        rowCount:
          type: integer
        acceptedCount:
          type: integer
        rejectedCount:
          type: integer
        errorShare:
          type: number
        blocked:
          type: boolean
        reasons:
          type: array
          items:
            type: object
            required: [reason, count]
            properties:
              reason:
                $ref: '#/components/schemas/RejectReason'
              count:
                type: integer
        generatedAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - FORMAT_INVALID
            - MISSING_REQUIRED_COLUMNS
            - INVALID_QUERY_PARAM
            - UNAUTHENTICATED
            - FORBIDDEN
            - REGISTRY_NOT_FOUND
            - REGISTRY_LIMIT_EXCEEDED
            - REGISTRY_BLOCKED
            - REGISTRY_NOT_VALIDATION_FAILED
            - IDEMPOTENCY_KEY_REUSED
            - FILE_TOO_LARGE
            - INTERNAL_ERROR
            - SERVICE_UNAVAILABLE
        message:
          type: string
