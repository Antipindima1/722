asyncapi: 3.0.0
id: urn:vyplatypro:payout-events
defaultContentType: application/json
info:
  title: ВыплатыПро — события выплат (Ф2)
  version: 2.0.0
  description: |
    События контура выплат по допущению AS-21. Описано приложение «Сервис выплат»: он отправляет
    все три события, поэтому используются операции send. Ключ сообщения — payoutId: события одной
    выплаты идут по порядку. Доставка событий — отдельная политика (AS-20), она не связана с
    повторами вызова СБП из AS-17.
  contact:
    name: ВыплатыПро
    url: https://vyplatypro.example
  tags:
    - name: payouts
      description: События выплат
servers:
  production:
    host: broker.vyplatypro.example:9092
    protocol: kafka
    description: Продуктивный брокер событий
channels:
  payoutSent:
    address: payout.sent
    description: Выплата проведена, СБП подтвердил перевод.
    messages:
      PayoutSent:
        $ref: '#/components/messages/PayoutSent'
  payoutFailed:
    address: payout.failed
    description: |
      Выплата не выполнена — после исчерпания попыток или по бизнес-причине (утрата статуса,
      отказ СБП).
    messages:
      PayoutFailed:
        $ref: '#/components/messages/PayoutFailed'
  payoutRetryScheduled:
    address: payout.retry-scheduled
    description: Назначена повторная попытка выплаты.
    messages:
      PayoutRetryScheduled:
        $ref: '#/components/messages/PayoutRetryScheduled'
  payoutDlq:
    address: payout.events.dlq
    description: Недоставленные события выплат после исчерпания попыток доставки.
    messages:
      DlqEnvelope:
        $ref: '#/components/messages/DlqEnvelope'
operations:
  sendPayoutSent:
    action: send
    summary: Сервис выплат сообщает об успешной выплате
    channel:
      $ref: '#/channels/payoutSent'
    messages:
      - $ref: '#/channels/payoutSent/messages/PayoutSent'
    x-delivery-policy:
      maxAttempts: 3
      backoffSeconds: [1, 5, 15]
      dlqChannel: payoutDlq
      source: AS-20
  sendPayoutFailed:
    action: send
    summary: Сервис выплат сообщает о неуспешной выплате
    channel:
      $ref: '#/channels/payoutFailed'
    messages:
      - $ref: '#/channels/payoutFailed/messages/PayoutFailed'
    x-delivery-policy:
      maxAttempts: 3
      backoffSeconds: [1, 5, 15]
      dlqChannel: payoutDlq
      source: AS-20
  sendPayoutRetryScheduled:
    action: send
    summary: Сервис выплат сообщает о назначенной попытке
    channel:
      $ref: '#/channels/payoutRetryScheduled'
    messages:
      - $ref: '#/channels/payoutRetryScheduled/messages/PayoutRetryScheduled'
  sendPayoutEventToDlq:
    action: send
    summary: Публикация недоставленного события в DLQ
    channel:
      $ref: '#/channels/payoutDlq'
    messages:
      - $ref: '#/channels/payoutDlq/messages/DlqEnvelope'
components:
  messages:
    PayoutSent:
      name: PayoutSent
      title: Выплата исполнена
      summary: СБП подтвердил перевод
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: payout_id
      payload:
        $ref: '#/components/schemas/PayoutSentPayload'
    PayoutFailed:
      name: PayoutFailed
      title: Выплата не выполнена
      summary: Технический отказ или бизнес-причина
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: payout_id
      payload:
        $ref: '#/components/schemas/PayoutFailedPayload'
    PayoutRetryScheduled:
      name: PayoutRetryScheduled
      title: Назначена повторная попытка
      summary: Сервис выплат планирует следующую попытку
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: payout_id
      payload:
        $ref: '#/components/schemas/PayoutRetryPayload'
    DlqEnvelope:
      name: DlqEnvelope
      title: Недоставленное событие
      summary: Исходное сообщение вместе с причиной недоставки
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: payout_id
      payload:
        $ref: '#/components/schemas/DlqEnvelopePayload'
  schemas:
    EventEnvelope:
      type: object
      required: [eventId, eventType, occurredAt, payoutId, registryId]
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
        occurredAt:
          type: string
          format: date-time
        payoutId:
          type: string
          format: uuid
          description: Ключ партиционирования
        registryId:
          type: string
          format: uuid
    PayoutSentPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [rowId, amount, sbpRef]
          properties:
            rowId:
              type: string
              format: uuid
            amount:
              type: string
              pattern: '^\d+\.\d{2}$'
            sbpRef:
              type: string
    PayoutFailedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [rowId, reason]
          properties:
            rowId:
              type: string
              format: uuid
            attempts:
              type: integer
              minimum: 0
              maximum: 3
            reason:
              type: string
              enum: [SBP_REJECTED, SBP_TIMEOUT, CONTRACTOR_STATUS_LOST, FNS_UNAVAILABLE, INTERNAL_ERROR]
    PayoutRetryPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [rowId, attempt, nextAttemptAt]
          properties:
            rowId:
              type: string
              format: uuid
            attempt:
              type: integer
              minimum: 1
              maximum: 3
            nextAttemptAt:
              type: string
              format: date-time
    DlqEnvelopePayload:
      type: object
      required: [originalEvent, reason, failedAt]
      properties:
        originalEvent:
          description: Исходное сообщение
          oneOf:
            - $ref: '#/components/schemas/PayoutSentPayload'
            - $ref: '#/components/schemas/PayoutFailedPayload'
            - $ref: '#/components/schemas/PayoutRetryPayload'
        reason:
          type: string
        failedAt:
          type: string
          format: date-time
        attempts:
          type: integer
          minimum: 1
