asyncapi: 3.0.0
id: urn:vyplatypro:registry-events
defaultContentType: application/json
info:
  title: ВыплатыПро — события реестра выплат (Ф1)
  version: 2.0.0
  description: |
    События сервиса реестров. Описано приложение «Сервис реестров»: он отправляет события
    о загрузке, результате и сбое проверки, а также читает собственные события воркером
    проверки — поэтому для чтения используется receive.
    Ключ сообщения — registry_id: события одного реестра идут по порядку.
    Доставка событий — отдельная политика (AS-20): 3 попытки 1/5/15 секунд, затем DLQ.
  contact:
    name: ВыплатыПро
    url: https://vyplatypro.example
  tags:
    - name: registry
      description: События реестра выплат
servers:
  production:
    host: broker.vyplatypro.example:9092
    protocol: kafka
    description: Продуктивный брокер событий
channels:
  registryUploaded:
    address: registry.uploaded
    description: Реестр принят и поставлен в очередь на проверку.
    messages:
      RegistryUploaded:
        $ref: '#/components/messages/RegistryUploaded'
  registryChecked:
    address: registry.checked
    description: Проверка завершена — реестр проверен или заблокирован.
    messages:
      RegistryChecked:
        $ref: '#/components/messages/RegistryChecked'
  registryValidationFailed:
    address: registry.validation-failed
    description: Проверка не выполнена по технической причине.
    messages:
      RegistryValidationFailed:
        $ref: '#/components/messages/RegistryValidationFailed'
  registryRevalidationRequested:
    address: registry.revalidation-requested
    description: Запрос повторной проверки после устранения технической причины.
    messages:
      RegistryRevalidationRequested:
        $ref: '#/components/messages/RegistryRevalidationRequested'
  registryDlq:
    address: registry.events.dlq
    description: Недоставленные события реестра после исчерпания попыток доставки.
    messages:
      DlqEnvelope:
        $ref: '#/components/messages/DlqEnvelope'
operations:
  sendRegistryUploaded:
    action: send
    summary: Сервис реестров сообщает о принятом файле
    channel:
      $ref: '#/channels/registryUploaded'
    messages:
      - $ref: '#/channels/registryUploaded/messages/RegistryUploaded'
    x-delivery-policy:
      maxAttempts: 3
      backoffSeconds: [1, 5, 15]
      dlqChannel: registryDlq
      source: AS-20
  receiveRegistryUploaded:
    action: receive
    summary: Воркер проверки читает событие о загрузке
    channel:
      $ref: '#/channels/registryUploaded'
    messages:
      - $ref: '#/channels/registryUploaded/messages/RegistryUploaded'
    bindings:
      kafka:
        groupId:
          type: string
          enum: [registry-validation-worker]
  sendRegistryChecked:
    action: send
    summary: Сервис реестров сообщает результат проверки
    channel:
      $ref: '#/channels/registryChecked'
    messages:
      - $ref: '#/channels/registryChecked/messages/RegistryChecked'
    x-delivery-policy:
      maxAttempts: 3
      backoffSeconds: [1, 5, 15]
      dlqChannel: registryDlq
      source: AS-20
  sendRegistryValidationFailed:
    action: send
    summary: Сервис реестров сообщает о техническом сбое проверки
    channel:
      $ref: '#/channels/registryValidationFailed'
    messages:
      - $ref: '#/channels/registryValidationFailed/messages/RegistryValidationFailed'
    x-delivery-policy:
      maxAttempts: 3
      backoffSeconds: [1, 5, 15]
      dlqChannel: registryDlq
      source: AS-20
  sendRegistryRevalidationRequested:
    action: send
    summary: Сервис реестров отправляет реестр на повторную проверку
    channel:
      $ref: '#/channels/registryRevalidationRequested'
    messages:
      - $ref: '#/channels/registryRevalidationRequested/messages/RegistryRevalidationRequested'
    x-delivery-policy:
      maxAttempts: 3
      backoffSeconds: [1, 5, 15]
      dlqChannel: registryDlq
      source: AS-20
  receiveRegistryRevalidationRequested:
    action: receive
    summary: Воркер проверки читает запрос повторной проверки
    channel:
      $ref: '#/channels/registryRevalidationRequested'
    messages:
      - $ref: '#/channels/registryRevalidationRequested/messages/RegistryRevalidationRequested'
  sendRegistryEventToDlq:
    action: send
    summary: Публикация недоставленного события в DLQ
    channel:
      $ref: '#/channels/registryDlq'
    messages:
      - $ref: '#/channels/registryDlq/messages/DlqEnvelope'
components:
  messages:
    RegistryUploaded:
      name: RegistryUploaded
      title: Реестр принят
      summary: Реестр загружен и ожидает проверки
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: registry_id
      payload:
        $ref: '#/components/schemas/RegistryUploadedPayload'
    RegistryChecked:
      name: RegistryChecked
      title: Реестр проверен
      summary: Проверка завершена, известен результат и счётчики
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: registry_id
      payload:
        $ref: '#/components/schemas/RegistryCheckedPayload'
    RegistryValidationFailed:
      name: RegistryValidationFailed
      title: Проверка не выполнена
      summary: Техническая причина, по которой проверка не состоялась
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: registry_id
      payload:
        $ref: '#/components/schemas/RegistryValidationFailedPayload'
    RegistryRevalidationRequested:
      name: RegistryRevalidationRequested
      title: Запрос повторной проверки
      summary: Реестр нужно проверить повторно после устранения причины
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: registry_id
      payload:
        $ref: '#/components/schemas/RegistryRevalidationPayload'
    DlqEnvelope:
      name: DlqEnvelope
      title: Недоставленное событие
      summary: Исходное сообщение вместе с причиной недоставки
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: registry_id
      payload:
        $ref: '#/components/schemas/DlqEnvelopePayload'
  schemas:
    EventEnvelope:
      type: object
      required: [eventId, eventType, occurredAt, registryId]
      properties:
        eventId:
          type: string
          format: uuid
          description: Идентификатор события для защиты от повторной обработки
        eventType:
          type: string
        occurredAt:
          type: string
          format: date-time
        registryId:
          type: string
          format: uuid
          description: Идентификатор реестра, он же ключ партиционирования
    RegistryUploadedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [status, rowCount]
          properties:
            status:
              type: string
              enum: [VALIDATING]
            rowCount:
              type: integer
              minimum: 1
            objectKey:
              type: string
    RegistryCheckedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [status, rowCount, acceptedCount, rejectedCount, errorShare]
          properties:
            status:
              type: string
              enum: [CHECKED, BLOCKED]
            rowCount:
              type: integer
              minimum: 1
            acceptedCount:
              type: integer
              minimum: 0
            rejectedCount:
              type: integer
              minimum: 0
            errorShare:
              type: number
              format: float
              minimum: 0
              maximum: 1
    RegistryValidationFailedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [reason]
          properties:
            reason:
              type: string
              enum: [FILE_UNAVAILABLE, VALIDATION_TIMEOUT, INTERNAL_ERROR]
            attempts:
              type: integer
              minimum: 1
    RegistryRevalidationPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [reason]
          properties:
            reason:
              type: string
              enum: [FILE_AVAILABLE_AGAIN, MANUAL_REQUEST]
    DlqEnvelopePayload:
      type: object
      required: [originalEvent, reason, failedAt]
      properties:
        originalEvent:
          description: Исходное сообщение
          oneOf:
            - $ref: '#/components/schemas/RegistryUploadedPayload'
            - $ref: '#/components/schemas/RegistryCheckedPayload'
            - $ref: '#/components/schemas/RegistryValidationFailedPayload'
            - $ref: '#/components/schemas/RegistryRevalidationPayload'
        reason:
          type: string
        failedAt:
          type: string
          format: date-time
        attempts:
          type: integer
          minimum: 1
